<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eventisma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0f;
      background-image:
        linear-gradient(rgba(0,243,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,243,255,0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      color: #e8e8ec;
      margin: 0;
      padding: 0 24px 60px;
      min-height: 100vh;
    }

    header {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 0 32px;
    }
    .eyebrow {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #ff6b5b;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 40px;
      margin: 0;
      color: #f4f4f6;
      letter-spacing: -0.01em;
    }
    h1 span { color: #00f3ff; }
    .tagline {
      color: #8a8a95;
      font-size: 15px;
      margin-top: 8px;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
    }

    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8a8a95;
      margin: 40px 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h2::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #23232e;
    }

    /* --- Form --- */
    form {
      background: #14141c;
      border: 1px solid #23232e;
      border-radius: 10px;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    form .full { grid-column: 1 / -1; }
    label {
      font-size: 12px;
      color: #8a8a95;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    input {
      background: #0a0a0f;
      border: 1px solid #23232e;
      color: #f4f4f6;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
    }
    input:focus {
      outline: none;
      border-color: #00f3ff;
    }
    button {
      grid-column: 1 / -1;
      background: #00f3ff;
      color: #0a0a0f;
      border: none;
      padding: 13px;
      border-radius: 6px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.85; }
    button:active { opacity: 0.7; }
    #formStatus {
      grid-column: 1 / -1;
      font-size: 13px;
      color: #8a8a95;
      min-height: 16px;
    }

    /* --- Event grid --- */
    #status {
      color: #8a8a95;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .empty {
      border: 1px dashed #23232e;
      border-radius: 10px;
      padding: 40px 24px;
      text-align: center;
      color: #8a8a95;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* Signature element: ticket-stub card with a torn perforated divider */
    .ticket {
      background: #14141c;
      border: 1px solid #23232e;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .ticket:hover {
      border-color: #00f3ff;
      transform: translateY(-2px);
    }
    .ticket-main {
      padding: 18px 20px 16px;
    }
    .ticket-category {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ff6b5b;
      margin-bottom: 8px;
    }
    .ticket-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #f4f4f6;
      margin: 0 0 6px;
      line-height: 1.3;
    }
    .ticket-venue {
      font-size: 13px;
      color: #8a8a95;
    }
    .tear {
      position: relative;
      border-top: 1px dashed #34343f;
      margin: 4px 0;
    }
    .tear::before, .tear::after {
      content: '';
      position: absolute;
      top: -7px;
      width: 14px;
      height: 14px;
      background: #0a0a0f;
      border-radius: 50%;
    }
    .tear::before { left: -7px; }
    .tear::after { right: -7px; }
    .ticket-footer {
      padding: 14px 20px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ticket-date {
      font-size: 12px;
      color: #8a8a95;
      font-family: 'Space Grotesk', sans-serif;
    }
    .ticket-price {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: #00f3ff;
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Campus event platform</div>
    <h1>Event<span>isma</span></h1>
    <p class="tagline">Every club, one calendar. Browse what's happening and add your own event below.</p>
  </header>

  <main>
    <h2>Add an event</h2>
    <form id="addEventForm">
      <label class="full">
        Title
        <input type="text" id="title" required />
      </label>
      <label>
        Category
        <input type="text" id="category" placeholder="e.g. Hackathon" required />
      </label>
      <label>
        Venue
        <input type="text" id="venue" required />
      </label>
      <label>
        Date
        <input type="date" id="date" required />
      </label>
      <label>
        Price (0 for free)
        <input type="number" id="price" value="0" min="0" required />
      </label>
      <label>
        Total slots
        <input type="number" id="totalSlots" value="50" min="1" required />
      </label>
      <button type="submit">Add event</button>
      <div id="formStatus"></div>
    </form>

    <h2>All events</h2>
    <div id="status">Loading events...</div>
    <div class="grid" id="eventGrid"></div>
  </main>

  <script>
    // Address of your Spring Boot backend.
    // IMPORTANT: update this if your Codespace URL ever changes.
    const API_URL = "https://effective-enigma-7vq9vprqrw4p2xgp6-8080.app.github.dev/api/events";

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    async function loadEvents() {
      const statusEl = document.getElementById("status");
      const gridEl = document.getElementById("eventGrid");
      gridEl.innerHTML = "";

      try {
        const response = await fetch(API_URL);
        const events = await response.json();

        if (events.length === 0) {
          statusEl.innerHTML = "";
          gridEl.innerHTML = '<div class="empty">No events yet — add the first one using the form above.</div>';
          return;
        }

        statusEl.textContent = `${events.length} event${events.length === 1 ? '' : 's'} live right now.`;

        events.forEach(function (event) {
          const card = document.createElement("div");
          card.className = "ticket";
          card.innerHTML = `
            <div class="ticket-main">
              <div class="ticket-category">${event.category || "Event"}</div>
              <h3 class="ticket-title">${event.title || "Untitled event"}</h3>
              <div class="ticket-venue">${event.venue || ""}</div>
            </div>
            <div class="tear"></div>
            <div class="ticket-footer">
              <span class="ticket-date">${formatDate(event.date)}</span>
              <span class="ticket-price">${event.price === 0 || !event.price ? "Free" : "$" + event.price}</span>
            </div>
          `;
          gridEl.appendChild(card);
        });
      } catch (err) {
        statusEl.textContent = "";
        gridEl.innerHTML = '<div class="empty">Could not reach the backend. Is it running?</div>';
        console.error(err);
      }
    }

    document.getElementById("addEventForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formStatus = document.getElementById("formStatus");
      formStatus.textContent = "Saving...";

      const newEvent = {
        title: document.getElementById("title").value,
        category: document.getElementById("category").value,
        venue: document.getElementById("venue").value,
        date: document.getElementById("date").value,
        price: parseFloat(document.getElementById("price").value),
        totalSlots: parseInt(document.getElementById("totalSlots").value),
        registeredSlots: 0
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newEvent)
        });

        if (!response.ok) throw new Error("Server responded with an error");

        formStatus.textContent = "Event added.";
        document.getElementById("addEventForm").reset();
        loadEvents();
      } catch (err) {
        formStatus.textContent = "Failed to add event.";
        console.error(err);
      }
    });

    loadEvents();
  </script>
</body>
</html>
