# Server port
server.port=8080

# H2 in-memory database (data resets every restart -- fine for dev/testing)
spring.datasource.url=jdbc:h2:mem:eventisma
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create tables from the @Entity classes on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console -- lets you view the database in a browser
# Visit http://localhost:8080/h2-console while the app is running
spring.h2.console.enabled=true
