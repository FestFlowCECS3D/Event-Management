server.port=${PORT:8080}

# PostgreSQL connection -- values come from Render's environment variables,
# never hardcoded here (keeps passwords out of your GitHub repo)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-create/update tables from the @Entity classes on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 console no longer applies
spring.h2.console.enabled=false
